name: build.unix

on:
  push:
  pull_request:
  workflow_dispatch:

# Keep in sync with the clang-format version used by developers
# (see `clang-format --version` locally).
env:
  CLANG_FORMAT_VERSION: '23.1.0'

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin clang-format to the same release developers use, via the PyPI
      # package. The default clang-format on ubuntu-latest lags upstream, and
      # .clang-format relies on recent options (SpacesInParens, DeriveLineEnding,
      # ...). Installing an exact version keeps the check reproducible and
      # identical to the local toolchain.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pip install -q "clang-format==$CLANG_FORMAT_VERSION"

      - name: Show clang-format version
        run: clang-format --version

      - name: Check formatting (make format-check)
        working-directory: build.unix
        run: make format-check

  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          make --version | head -1
          c++ --version | head -1

      - name: Build (make all)
        working-directory: build.unix
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            JOBS=$(sysctl -n hw.ncpu)
          else
            JOBS=$(nproc)
          fi
          make -j"$JOBS" all

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        working-directory: build.unix
        # The VM runtime may hit platform issues; don't fail the build over it.
        continue-on-error: true
        timeout-minutes: 10
        run: make test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: strongtalk-${{ matrix.os }}
          path: |
            build.unix/strongtalk
            build.unix/stest
            build.unix/strongtalk.so
            build.unix/stest.so
