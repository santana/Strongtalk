name: build-windows-mingw

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (MinGW cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW toolchain and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 wine64 xvfb
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Show toolchain
        run: |
          x86_64-w64-mingw32-g++ --version | head -1

      - name: Build (make all, OS=mingw)
        run: make -j"$(nproc)" all OS=mingw CXX=x86_64-w64-mingw32-g++

      - name: Smoke test Windows binaries under Wine
        # The VM runtime may hit platform/emulation issues; don't fail the
        # build over it (same policy as the Linux test job). Run under a
        # timeout so a hung process stops quickly; stream stdout directly to
        # the CI log (redirecting to a file loses the VM's buffered output if
        # the process is killed), and capture the exit code with `||` so
        # bash -e does not abort before it is printed.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          GCDLL=$(dirname "$(x86_64-w64-mingw32-g++ -print-file-name=libgcc_s_seh-1.dll)")
          SCDLL=$(dirname "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++-6.dll)")
          cp "$GCDLL/libgcc_s_seh-1.dll" "$SCDLL/libstdc++-6.dll" build/x86_64-mingw-gcc/
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll build/x86_64-mingw-gcc/
          cd build/x86_64-mingw-gcc
          WINEDEBUG=-all timeout 120 xvfb-run -a /usr/lib/wine/wine64 ./strongtalk.exe -b ../../strongtalk.bst || rc=$?
          echo "=== strongtalk.exe exit code: ${rc:-0} (124 = timed out) ==="

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: strongtalk-windows-mingw
          path: |
            build/x86_64-mingw-gcc/strongtalk.exe
            build/x86_64-mingw-gcc/stest.exe
            build/x86_64-mingw-gcc/strongtalk.so
            build/x86_64-mingw-gcc/stest.so