name: build-macos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build on macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          make --version | head -1
          c++ --version | head -1

      - name: Build (make all)
        run: make -j"$(sysctl -n hw.ncpu)" all

      # No artifact upload here: binaries are only published for tags, by
      # release.yml, which builds the versioned, self-contained bundle
      # (`make package`) and attaches it to the GitHub Release.
