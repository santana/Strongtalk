name: build-windows-native

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-native:
    name: Build and run Windows (native, MinGW-W64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 with MinGW-W64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          # No whole-system upgrade: the action extracts a fresh MSYS2 base
          # release that already fits our needs.
          update: false

      - name: Install MinGW-W64 toolchain (resync + retry)
        # `pacman -S` currently fails intermittently with "target not found:
        # mingw-w64-x86-64-gcc" because the mingw64 repo DB the runner's
        # mirror serves is mis-synced. Force `-Syy` (re-download the DBs) and
        # retry a few times so the job self-heals once upstream recovers.
        run: |
          set +e
          ok=0
          for i in 1 2 3 4 5; do
            pacman -Syy --noconfirm
            pacman -S --noconfirm --needed --overwrite '*' mingw-w64-x86-64-gcc make
            if [ $? -eq 0 ]; then
              ok=1
              break
            fi
            echo "pacman install attempt $i failed; retrying in 15s" >&2
            sleep 15
          done
          [ $ok -eq 1 ]

      - name: Show toolchain
        run: |
          g++ --version | head -1
          make --version | head -1

      - name: Build (make all)
        run: make -j"$(nproc)" all

      - name: Run VM smoke test (strongtalk.exe)
        # The VM runtime may hit platform issues; don't fail the build over it
        # (same policy as the Linux test job). Run under a timeout so a hung
        # process stops quickly; stream stdout directly to the CI log (a
        # redirect loses buffered output when the process dies), and capture
        # the exit code with `||` so bash -e does not abort before printing.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cd build/x86_64-mingw-gcc
          timeout 120 ./strongtalk.exe -b ../../strongtalk.bst || rc=$?
          echo "=== strongtalk.exe exit code: ${rc:-0} (124 = timed out) ==="

      - name: Run tests (make test)
        continue-on-error: true
        timeout-minutes: 10
        run: make test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: strongtalk-windows-native
          path: |
            build/x86_64-mingw-gcc/strongtalk.exe
            build/x86_64-mingw-gcc/stest.exe
            build/x86_64-mingw-gcc/strongtalk.so
            build/x86_64-mingw-gcc/stest.so