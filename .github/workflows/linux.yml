name: build-linux

on:
  push:
  pull_request:
  workflow_dispatch:

# Keep in sync with the clang-format version used by developers
# (see `clang-format --version` locally).
env:
  CLANG_FORMAT_VERSION: '23.1.0'

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pin clang-format to the same release developers use, via the PyPI
      # package. The default clang-format on ubuntu-latest lags upstream, and
      # .clang-format relies on recent options (SpacesInParens, DeriveLineEnding,
      # ...). Installing an exact version keeps the check reproducible and
      # identical to the local toolchain.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pip install -q "clang-format==$CLANG_FORMAT_VERSION"

      - name: Show clang-format version
        run: clang-format --version

      - name: Check formatting (make format-check)
        run: make format-check

  build-linux:
    name: Build on Linux (x86-64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          make --version | head -1
          c++ --version | head -1

      - name: Build (make all)
        run: make -j"$(nproc)" all

      - name: Run tests
        # The VM runtime may hit platform issues; don't fail the build over it.
        continue-on-error: true
        timeout-minutes: 10
        run: make test

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: strongtalk-linux
          path: |
            build/*/strongtalk
            build/*/stest
            build/*/strongtalk.so
            build/*/stest.so