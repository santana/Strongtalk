name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# Keep in sync with the clang-format version used by developers
# (see `clang-format --version` locally).
env:
  CLANG_FORMAT_VERSION: '23.1.0'

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin clang-format to the same release developers use, via the PyPI
      # package. The default clang-format on ubuntu-latest lags upstream, and
      # .clang-format relies on recent options (SpacesInParens, DeriveLineEnding,
      # ...). Installing an exact version keeps the check reproducible and
      # identical to the local toolchain.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install clang-format ${{ env.CLANG_FORMAT_VERSION }}
        run: pip install -q "clang-format==$CLANG_FORMAT_VERSION"

      - name: Show clang-format version
        run: clang-format --version

      - name: Check formatting (make format-check)
        run: make format-check

  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          make --version | head -1
          c++ --version | head -1

      - name: Build (make all)
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            JOBS=$(sysctl -n hw.ncpu)
          else
            JOBS=$(nproc)
          fi
          make -j"$JOBS" all

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        # The VM runtime may hit platform issues; don't fail the build over it.
        continue-on-error: true
        timeout-minutes: 10
        run: make test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: strongtalk-${{ matrix.os }}
          path: |
            build/*/strongtalk
            build/*/stest
            build/*/strongtalk.so
            build/*/stest.so

  build-windows:
    name: Build Windows (MinGW cross)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW toolchain and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 wine64 xvfb
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Show toolchain
        run: |
          x86_64-w64-mingw32-g++ --version | head -1

      - name: Build (make all, OS=mingw)
        run: make -j"$(nproc)" all OS=mingw CXX=x86_64-w64-mingw32-g++

      - name: Smoke test Windows binaries under Wine
        # The VM runtime may hit platform/emulation issues; don't fail the
        # build over it (same policy as the Linux test job). Run under a
        # timeout so a hung process stops quickly instead of stalling the
        # step for timeout-minutes.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          GCDLL=$(dirname "$(x86_64-w64-mingw32-g++ -print-file-name=libgcc_s_seh-1.dll)")
          SCDLL=$(dirname "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++-6.dll)")
          cp "$GCDLL/libgcc_s_seh-1.dll" "$SCDLL/libstdc++-6.dll" build/x86_64-mingw-gcc/
          cp /usr/x86_64-w64-mingw32/lib/libwinpthread-1.dll build/x86_64-mingw-gcc/
          cd build/x86_64-mingw-gcc
          WINEDEBUG=-all timeout 120 xvfb-run -a /usr/lib/wine/wine64 ./strongtalk.exe -b ../../strongtalk.bst > smoke.log 2>&1
          rc=$?
          echo "=== strongtalk.exe finished, timeout(1) exit code: $rc (124 = timed out) ==="
          tail -60 smoke.log

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: strongtalk-windows-mingw
          path: |
            build/x86_64-mingw-gcc/strongtalk.exe
            build/x86_64-mingw-gcc/stest.exe
            build/x86_64-mingw-gcc/strongtalk.so
            build/x86_64-mingw-gcc/stest.so

  build-windows-native:
    name: Build and run Windows (native, MinGW-W64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 with MinGW-W64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Show toolchain
        run: |
          g++ --version | head -1
          make --version | head -1

      - name: Build (make all)
        run: make -j"$(nproc)" all

      - name: Run VM smoke test (strongtalk.exe)
        # The VM runtime may hit platform issues; don't fail the build over it
        # (same policy as the Linux test job). Run under a timeout so a hung
        # process stops quickly instead of stalling the step.
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cd build/x86_64-mingw-gcc
          timeout 120 ./strongtalk.exe -b ../../strongtalk.bst > smoke.log 2>&1
          rc=$?
          echo "=== strongtalk.exe finished, timeout(1) exit code: $rc (124 = timed out) ==="
          tail -60 smoke.log

      - name: Run tests (make test)
        continue-on-error: true
        timeout-minutes: 10
        run: make test

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: strongtalk-windows-native
          path: |
            build/x86_64-mingw-gcc/strongtalk.exe
            build/x86_64-mingw-gcc/stest.exe
            build/x86_64-mingw-gcc/strongtalk.so
            build/x86_64-mingw-gcc/stest.so
